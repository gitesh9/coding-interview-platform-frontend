<!-- drawer component -->
<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black opacity-70 z-30"
  (click)="closeSidebar()"
></div>
<div
  id="drawer-navigation"
  #drawer
  [ngClass]="{
    '-translate-x-full': !isOpen,
    'translate-x-0': isOpen,
  }"
  class="fixed p-4 top-0 left-0 z-40 w-80 h-screen overflow-y-auto transition-transform -translate-x-full bg-white dark:bg-[#282c31] border-r border-0 dark:border-0"
  aria-labelledby="drawer-navigation-label"
>
  <!-- Header -->
  <div
    class="flex items-center justify-between border-b border-gray-200 dark:border-gray-500 mb-2 pb-2"
  >
    <!-- Navigation Link -->
    <a
      tabindex="0"
      [routerLink]="['problemset']"
      routerLinkActive="router-link-active"
      #allProblemsLink
      class="text-sm font-medium hover:text-blue-800 dark:hover:text-blue-200 flex items-center"
      (click)="closeSidebar()"
    >
      Problems list
      <svg
        class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
          clip-rule="evenodd"
        ></path>
      </svg>
    </a>
    <button
      type="button"
      (click)="closeSidebar()"
      aria-controls="drawer-navigation"
      class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white"
    >
      <svg
        aria-hidden="true"
        class="w-5 h-5"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          clip-rule="evenodd"
        ></path>
      </svg>
      <span class="sr-only">Close menu</span>
    </button>
  </div>

  <!-- Problems List -->
  <div class="flex-1 overflow-y-auto py-2 my-2">
    <div class="flex flex-col gap-y-[1.5rem]">
      <div
        *ngFor="let problem of problems; let i = index"
        class="group relative"
      >
        <a
          [routerLink]="['/problem', problem.id]"
          (click)="closeSidebar()"
          class="flex items-center rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 cursor-pointer"
        >
          <!-- Problem Number -->
          <!-- <div class="flex-shrink-0 w-8 text-center">
            <span class="text-sm font-medium text-gray-500 dark:text-gray-400">
              {{ problem.id }}
            </span>
          </div> -->

          <!-- Solved Indicator -->
          <div
            class="flex-shrink-0 w-6 h-6 mr-3 flex items-center justify-center"
          >
            <div
              *ngIf="problem.isSolved"
              class="w-5 h-5 rounded-full bg-green-500 flex items-center justify-center"
            >
              <svg
                class="w-3 h-3 text-white"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"
                ></path>
              </svg>
            </div>
            <div
              *ngIf="!problem.isSolved"
              class="w-5 h-5 rounded-full border-2 border-gray-300 dark:border-gray-600"
            ></div>
          </div>

          <!-- Problem Content -->
          <div class="flex-1 min-w-0">
            <!-- Title -->
            <div class="flex items-center justify-between">
              <h3
                class="text-sm font-medium text-gray-900 dark:text-white truncate group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-200"
              >
                {{ problem.title }}
              </h3>

              <!-- Difficulty Badge -->
              <span
                class="ml-2 px-2 py-1 text-xs font-medium rounded-full flex-shrink-0"
                [ngClass]="{
                  'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200':
                    problem.difficulty === 'Easy',
                  'bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-200':
                    problem.difficulty === 'Medium',
                  'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200':
                    problem.difficulty === 'Hard',
                }"
              >
                {{ problem.difficulty }}
              </span>
            </div>
          </div>

          <!-- Arrow Icon -->
          <div class="flex-shrink-0 ml-3">
            <svg
              class="w-4 h-4 text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                clip-rule="evenodd"
              ></path>
            </svg>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer Stats (Optional) -->
  <div class="p-4 border-t border-gray-200 dark:border-gray-500">
    <div class="text-xs text-gray-500 dark:text-gray-400 text-center">
      {{ getSolvedCount() }} of {{ problems.length }} solved
    </div>
  </div>
</div>
