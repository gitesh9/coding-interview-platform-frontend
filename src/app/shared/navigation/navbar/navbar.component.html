<ng-container *ngIf="isProblemPage()">
  <app-sidebar></app-sidebar>
</ng-container>

<nav class="navbar-glass border-b border-gray-800/50">
  <div class="flex items-center justify-between mx-auto px-4 py-2.5">
    <ng-container *ngIf="isProblemPage(); else normalNav">
      <!-- ===== PROBLEM PAGE NAV ===== -->
      <div class="flex items-center gap-3">
        <!-- Logo -->
        <a [routerLink]="['/']" class="flex items-center gap-2 group">
          <img
            src="https://flowbite.com/docs/images/logo.svg"
            class="h-5 transition-transform group-hover:scale-110"
            alt="Logo"
          />
        </a>

        <!-- Divider -->
        <div class="h-5 w-px bg-gray-700"></div>

        <!-- Problems List button -->
        <button
          #problemsButton
          type="button"
          id="sidebar-button"
          (click)="openSidebar()"
          aria-controls="drawer-navigation"
          class="inline-flex items-center gap-2 py-1.5 px-3 text-sm font-medium text-gray-300 rounded-lg hover:bg-white/5 hover:text-white transition-all duration-200 cursor-pointer"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <span class="hidden sm:inline">Problems</span>
        </button>
      </div>

      <!-- Center: Timer + Interview -->
      <div class="flex items-center gap-3">
        <app-timer></app-timer>

        <!-- Interview Mode Toggle -->
        <button
          (click)="toggleInterview()"
          [class]="
            interviewService.isInterviewMode()
              ? 'inline-flex items-center gap-2 py-1.5 px-3 text-sm font-medium rounded-lg bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30 transition-all duration-200 cursor-pointer'
              : 'inline-flex items-center gap-2 py-1.5 px-3 text-sm font-medium rounded-lg text-gray-400 hover:bg-white/5 hover:text-white border border-transparent hover:border-gray-700 transition-all duration-200 cursor-pointer'
          "
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"
            />
            <path
              d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
            />
          </svg>
          <span
            *ngIf="interviewService.isInterviewMode()"
            class="relative flex h-2 w-2"
          >
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex rounded-full h-2 w-2 bg-red-400"
            ></span>
          </span>
          <span class="hidden sm:inline">{{
            interviewService.isInterviewMode() ? "End Interview" : "Interview"
          }}</span>
        </button>
      </div>

      <!-- Right: Action Buttons + User -->
      <div class="flex items-center gap-3">
        <app-action-buttons></app-action-buttons>
        <app-user></app-user>
      </div>
    </ng-container>

    <!-- ===== NORMAL NAV (Home, Problemset, About) ===== -->
    <ng-template #normalNav>
      <!-- Logo + Brand -->
      <a [routerLink]="['/']" class="flex items-center gap-2.5 group">
        <img
          src="https://flowbite.com/docs/images/logo.svg"
          class="h-6 transition-transform group-hover:scale-110"
          alt="Logo"
        />
        <span
          class="text-lg font-semibold text-white tracking-tight hidden sm:inline"
        >
          Smart Coding Platform
        </span>
      </a>

      <!-- Nav Links -->
      <div class="hidden md:flex items-center gap-1">
        <a
          [routerLink]="['']"
          routerLinkActive="nav-link-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          Home
        </a>
        <a
          [routerLink]="['/problemset']"
          routerLinkActive="nav-link-active"
          class="nav-link"
        >
          Problems
        </a>
        <a
          *ngIf="authService.isInterviewer()"
          [routerLink]="['/dashboard']"
          routerLinkActive="nav-link-active"
          class="nav-link"
        >
          Dashboard
        </a>
        <a
          *ngIf="authService.isCandidate()"
          [routerLink]="['/join']"
          routerLinkActive="nav-link-active"
          class="nav-link"
        >
          Join Session
        </a>
        <a
          [routerLink]="['/about']"
          routerLinkActive="nav-link-active"
          class="nav-link"
        >
          About
        </a>
      </div>

      <!-- Right: Auth -->
      <div class="flex items-center gap-3">
        <ng-container *ngIf="authService.isAuthenticated(); else authLinks">
          <span class="text-sm text-gray-400 hidden sm:inline">
            {{ authService.currentUser()?.name }}
          </span>
          <span
            class="text-xs px-2 py-0.5 rounded-full border"
            [ngClass]="
              authService.isInterviewer()
                ? 'text-purple-400 bg-purple-400/10 border-purple-400/20'
                : 'text-blue-400 bg-blue-400/10 border-blue-400/20'
            "
          >
            {{ authService.currentUser()?.role | titlecase }}
          </span>
          <button
            (click)="authService.logout()"
            class="text-sm text-gray-400 hover:text-white transition-colors"
          >
            Sign out
          </button>
        </ng-container>
        <ng-template #authLinks>
          <a [routerLink]="['/login']" class="nav-link">Sign in</a>
          <a
            [routerLink]="['/register']"
            class="inline-flex items-center py-1.5 px-4 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors"
          >
            Get started
          </a>
        </ng-template>
      </div>
    </ng-template>
  </div>
</nav>
