<div class="interview-panel" [class.minimized]="isMinimized">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-4 py-2.5 bg-gray-900 border-b border-gray-700 rounded-t-xl cursor-pointer select-none"
    (click)="toggleMinimize()"
  >
    <div class="flex items-center gap-2">
      <span class="relative flex h-2.5 w-2.5">
        <span
          class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"
        ></span>
        <span
          class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"
        ></span>
      </span>
      <span class="text-sm font-medium text-white">AI Interview</span>
    </div>
    <div class="flex items-center gap-1">
      <!-- Minimize/Maximize -->
      <button
        class="p-1 text-gray-400 hover:text-white rounded cursor-pointer"
        (click)="toggleMinimize(); $event.stopPropagation()"
        title="Minimize"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path
            *ngIf="!isMinimized"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 9l-7 7-7-7"
          />
          <path
            *ngIf="isMinimized"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 15l7-7 7 7"
          />
        </svg>
      </button>
      <!-- Close -->
      <button
        class="p-1 text-gray-400 hover:text-red-400 rounded cursor-pointer"
        (click)="endInterview(); $event.stopPropagation()"
        title="End interview"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Body (hidden when minimized) -->
  <ng-container *ngIf="!isMinimized">
    <!-- Messages -->
    <div
      #messagesContainer
      class="flex-1 overflow-y-auto p-4 space-y-3 messages-area"
    >
      <div
        *ngFor="let msg of interviewService.conversationHistory()"
        [class]="
          msg.role === 'interviewer' ? 'flex justify-start' : 'flex justify-end'
        "
      >
        <div
          [class]="
            msg.role === 'interviewer'
              ? 'max-w-[85%] px-3 py-2 rounded-lg bg-gray-700 text-gray-100 text-sm'
              : 'max-w-[85%] px-3 py-2 rounded-lg bg-blue-600 text-white text-sm'
          "
        >
          {{ msg.content }}
        </div>
      </div>

      <!-- AI thinking indicator -->
      <div *ngIf="interviewService.isAiThinking()" class="flex justify-start">
        <div
          class="px-3 py-2 rounded-lg bg-gray-700 text-gray-400 text-sm flex items-center gap-1.5"
        >
          <span class="flex gap-1">
            <span
              class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
              style="animation-delay: 0ms"
            ></span>
            <span
              class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
              style="animation-delay: 150ms"
            ></span>
            <span
              class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
              style="animation-delay: 300ms"
            ></span>
          </span>
          AI is thinking...
        </div>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="
          interviewService.conversationHistory().length === 0 &&
          !interviewService.isAiThinking()
        "
        class="flex items-center justify-center h-full text-gray-500 text-sm"
      >
        Starting interview...
      </div>
    </div>

    <!-- Transcript preview -->
    <div
      *ngIf="speechService.isListening() && speechService.transcript()"
      class="px-4 py-1.5 bg-gray-800/50 border-t border-gray-700 text-xs text-gray-400 italic truncate"
    >
      {{ speechService.transcript() }}
    </div>

    <!-- Input area -->
    <div
      class="flex items-end gap-2 p-3 border-t border-gray-700 bg-gray-900 rounded-b-xl"
    >
      <!-- Mic button -->
      <button
        (click)="toggleMic()"
        [disabled]="!speechService.isSupported()"
        [class]="
          speechService.isListening()
            ? 'p-2 rounded-lg bg-red-600 text-white animate-pulse cursor-pointer'
            : 'p-2 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed'
        "
        [title]="
          !speechService.isSupported()
            ? 'Speech recognition not supported in this browser'
            : speechService.isListening()
              ? 'Stop listening'
              : 'Start listening'
        "
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"
          />
          <path
            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
          />
        </svg>
      </button>

      <!-- Text input -->
      <textarea
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        placeholder="Type your answer..."
        rows="1"
        class="flex-1 bg-gray-800 text-white text-sm rounded-lg px-3 py-2 border border-gray-600 focus:border-blue-500 focus:outline-none resize-none"
      ></textarea>

      <!-- Send button -->
      <button
        (click)="sendMessage()"
        [disabled]="!userInput.trim()"
        class="p-2 rounded-lg bg-blue-600 text-white hover:bg-blue-500 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
        title="Send message"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </ng-container>
</div>
