<div class="h-full flex flex-col bg-[#1e1e1e] rounded-lg overflow-hidden">
  <!-- Header Bar -->
  <div
    class="flex items-center justify-between px-3 py-2 border-b border-gray-700 shrink-0"
  >
    <!-- Language Selector -->
    <div class="relative">
      <button
        (click)="toggleDropdown()"
        class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-300 bg-[#2d2d2d] rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
      >
        {{ currentLanguageLabel }}
        <svg
          class="w-3 h-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        *ngIf="showLanguageDropdown()"
        class="absolute top-full left-0 mt-1 bg-[#2d2d2d] border border-gray-600 rounded-md shadow-lg z-50 min-w-[140px]"
      >
        <button
          *ngFor="let lang of languages"
          (click)="selectLanguage(lang.id)"
          [class]="
            lang.id === selectedLanguage()
              ? 'w-full text-left px-3 py-2 text-sm text-green-60 bg-[#3d3d3d] cursor-pointer'
              : 'w-full text-left px-3 py-2 text-sm text-gray-300 hover:bg-[#3d3d3d] cursor-pointer'
          "
        >
          {{ lang.label }}
        </button>
      </div>
    </div>

    <!-- Right controls -->
    <div class="flex items-center gap-2">
      <!-- Theme toggle -->
      <button
        (click)="toggleTheme()"
        class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
        [title]="
          isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'
        "
      >
        <!-- Sun icon for dark mode (click to switch to light) -->
        <svg
          *ngIf="isDarkTheme()"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        <!-- Moon icon for light mode (click to switch to dark) -->
        <svg
          *ngIf="!isDarkTheme()"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>

      <!-- Reset button -->
      <button
        (click)="resetCode()"
        class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
        title="Reset to starter code"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
      </button>

      <!-- Hint button (hidden in interview mode) -->
      <button
        *ngIf="!interviewService.isInterviewMode()"
        (click)="getHint()"
        [disabled]="hintLoading()"
        class="p-1.5 text-yellow-400 hover:text-yellow-300 rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        title="Get a hint"
      >
        <!-- Spinner when loading -->
        <svg
          *ngIf="hintLoading()"
          class="w-4 h-4 animate-spin"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
          ></path>
        </svg>
        <!-- Lightbulb icon -->
        <svg
          *ngIf="!hintLoading()"
          class="w-4 h-4"
          fill="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Hint Banner -->
  <div
    *ngIf="showHint()"
    class="flex items-start gap-2 px-3 py-2 bg-yellow-900/30 border-b border-yellow-700/50 text-yellow-200 text-sm shrink-0"
  >
    <svg
      class="w-4 h-4 mt-0.5 shrink-0 text-yellow-400"
      fill="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"
      />
    </svg>
    <span class="flex-1">{{ hintText() }}</span>
    <button
      (click)="dismissHint()"
      class="text-yellow-400 hover:text-yellow-200 cursor-pointer shrink-0"
      title="Dismiss hint"
    >
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <!-- Monaco Editor -->
  <div class="flex-1 overflow-hidden">
    <ngx-monaco-editor
      class="editor-instance"
      [options]="editorOptions"
      [(ngModel)]="code"
      (ngModelChange)="onCodeChange($event)"
    ></ngx-monaco-editor>
  </div>
</div>

<!-- Click outside to close dropdown -->
<div
  *ngIf="showLanguageDropdown()"
  class="fixed inset-0 z-40"
  (click)="closeDropdown()"
></div>
