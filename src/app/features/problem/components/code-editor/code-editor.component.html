<div class="h-full flex flex-col bg-[#1e1e1e] rounded-lg m-1 overflow-hidden">
  <!-- Header Bar -->
  <div class="flex items-center justify-between px-3 py-2 border-b border-gray-700 shrink-0">
    <!-- Language Selector -->
    <div class="relative">
      <button
        (click)="toggleDropdown()"
        class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-300 bg-[#2d2d2d] rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
      >
        {{ currentLanguageLabel }}
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown -->
      <div
        *ngIf="showLanguageDropdown()"
        class="absolute top-full left-0 mt-1 bg-[#2d2d2d] border border-gray-600 rounded-md shadow-lg z-50 min-w-[140px]"
      >
        <button
          *ngFor="let lang of languages"
          (click)="selectLanguage(lang.id)"
          [class]="lang.id === selectedLanguage()
            ? 'w-full text-left px-3 py-2 text-sm text-green-60 bg-[#3d3d3d] cursor-pointer'
            : 'w-full text-left px-3 py-2 text-sm text-gray-300 hover:bg-[#3d3d3d] cursor-pointer'"
        >
          {{ lang.label }}
        </button>
      </div>
    </div>

    <!-- Right controls -->
    <div class="flex items-center gap-2">
      <!-- Theme toggle -->
      <button
        (click)="toggleTheme()"
        class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
        [title]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <!-- Sun icon for dark mode (click to switch to light) -->
        <svg *ngIf="isDarkTheme()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <!-- Moon icon for light mode (click to switch to dark) -->
        <svg *ngIf="!isDarkTheme()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>

      <!-- Reset button -->
      <button
        (click)="resetCode()"
        class="p-1.5 text-gray-400 hover:text-white rounded-md hover:bg-[#3d3d3d] transition-colors cursor-pointer"
        title="Reset to starter code"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Monaco Editor -->
  <div class="flex-1 overflow-hidden">
    <ngx-monaco-editor
      class="editor-instance"
      [options]="editorOptions"
      [(ngModel)]="code"
      (ngModelChange)="onCodeChange($event)"
    ></ngx-monaco-editor>
  </div>
</div>

<!-- Click outside to close dropdown -->
<div
  *ngIf="showLanguageDropdown()"
  class="fixed inset-0 z-40"
  (click)="closeDropdown()"
></div>
