<div class="h-full w-full" *ngIf="!loading(); else loadingSkeleton">
  <ng-container *ngIf="!error(); else errorState">
    <as-split direction="horizontal" [gutterSize]="6" class="problem-split">
      <!-- Left Panel: Problem Description -->
      <as-split-area [size]="40" [minSize]="20">
        <app-problem-description
          *ngIf="problem()"
          [problem]="problem()!"
        ></app-problem-description>
      </as-split-area>

      <!-- Right Panel: Code Editor + Test Cases -->
      <as-split-area [size]="60" [minSize]="30" class="right-panel">
        <as-split direction="vertical" [gutterSize]="6" class="vertical-split">
          <!-- Code Editor -->
          <as-split-area [size]="60" [minSize]="20">
            <app-code-editor
              *ngIf="problem()"
              [starterCode]="problem()!.starterCode"
              [problemDescription]="problem()!.description"
              (codeChange)="onCodeChange($event)"
              (languageChange)="onLanguageChange($event)"
              (run)="onRun()"
              (submit)="onSubmit()"
            ></app-code-editor>
          </as-split-area>

          <!-- Test Cases -->
          <as-split-area [size]="40" [minSize]="15">
            <app-test-cases
              *ngIf="problem()"
              [testCases]="problem()!.testCases"
              [submissionResult]="submissionResult()"
            ></app-test-cases>
          </as-split-area>
        </as-split>
      </as-split-area>
    </as-split>
  </ng-container>

  <!-- Interview Panel Overlay -->
  <app-interview-panel
    *ngIf="interviewService.isInterviewMode()"
    [problemContext]="problem()?.description || ''"
  ></app-interview-panel>
</div>

<ng-template #loadingSkeleton>
  <div class="h-full w-full flex" aria-busy="true" aria-label="Loading problem">
    <!-- Left Panel Skeleton -->
    <div
      class="w-[40%] h-full bg-[#1e1e1e] p-6 border-r border-gray-800 overflow-hidden"
    >
      <!-- Tab bar skeleton -->
      <div class="flex gap-4 mb-6 border-b border-gray-700 pb-3">
        <div class="h-4 w-20 rounded bg-gray-700 animate-pulse"></div>
        <div class="h-4 w-16 rounded bg-gray-800 animate-pulse"></div>
        <div class="h-4 w-18 rounded bg-gray-800 animate-pulse"></div>
      </div>
      <!-- Title skeleton -->
      <div class="h-6 w-3/4 rounded bg-gray-700 animate-pulse mb-3"></div>
      <!-- Difficulty badge -->
      <div class="h-5 w-14 rounded-full bg-gray-700 animate-pulse mb-6"></div>
      <!-- Description lines -->
      <div class="space-y-3">
        <div class="h-3 w-full rounded bg-gray-800 animate-pulse"></div>
        <div class="h-3 w-full rounded bg-gray-800 animate-pulse"></div>
        <div class="h-3 w-5/6 rounded bg-gray-800 animate-pulse"></div>
        <div class="h-3 w-full rounded bg-gray-800 animate-pulse"></div>
        <div class="h-3 w-2/3 rounded bg-gray-800 animate-pulse"></div>
      </div>
      <!-- Example block -->
      <div class="mt-6">
        <div class="h-4 w-24 rounded bg-gray-700 animate-pulse mb-3"></div>
        <div
          class="bg-[#2d2d2d] rounded-lg p-3 border-l-2 border-gray-600 space-y-2"
        >
          <div class="h-3 w-3/4 rounded bg-gray-700 animate-pulse"></div>
          <div class="h-3 w-1/2 rounded bg-gray-700 animate-pulse"></div>
          <div class="h-3 w-5/6 rounded bg-gray-700 animate-pulse"></div>
        </div>
      </div>
      <!-- Another example -->
      <div class="mt-4">
        <div class="h-4 w-24 rounded bg-gray-700 animate-pulse mb-3"></div>
        <div
          class="bg-[#2d2d2d] rounded-lg p-3 border-l-2 border-gray-600 space-y-2"
        >
          <div class="h-3 w-2/3 rounded bg-gray-700 animate-pulse"></div>
          <div class="h-3 w-1/2 rounded bg-gray-700 animate-pulse"></div>
        </div>
      </div>
      <!-- Constraints -->
      <div class="mt-6">
        <div class="h-4 w-28 rounded bg-gray-700 animate-pulse mb-3"></div>
        <div class="space-y-2">
          <div class="h-3 w-2/3 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-1/2 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-3/5 rounded bg-gray-800 animate-pulse"></div>
        </div>
      </div>
    </div>

    <!-- Right Panel Skeleton -->
    <div class="w-[60%] h-full flex flex-col">
      <!-- Code Editor Skeleton -->
      <div class="flex-[6] bg-[#1e1e1e] p-4 overflow-hidden">
        <!-- Language selector bar -->
        <div class="flex items-center gap-3 mb-4 border-b border-gray-700 pb-3">
          <div class="h-5 w-20 rounded bg-gray-700 animate-pulse"></div>
        </div>
        <!-- Code lines -->
        <div class="space-y-2 pl-4">
          <div class="h-3 w-48 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-64 rounded bg-gray-800 animate-pulse pl-4"></div>
          <div class="h-3 w-56 rounded bg-gray-800 animate-pulse pl-8"></div>
          <div class="h-3 w-40 rounded bg-gray-800 animate-pulse pl-8"></div>
          <div class="h-3 w-32 rounded bg-gray-800 animate-pulse pl-4"></div>
          <div class="h-3 w-20 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-0 rounded bg-transparent"></div>
          <div class="h-3 w-52 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-72 rounded bg-gray-800 animate-pulse pl-4"></div>
          <div class="h-3 w-44 rounded bg-gray-800 animate-pulse pl-8"></div>
          <div class="h-3 w-36 rounded bg-gray-800 animate-pulse pl-4"></div>
          <div class="h-3 w-16 rounded bg-gray-800 animate-pulse"></div>
        </div>
      </div>
      <!-- Gutter -->
      <div class="h-1.5 bg-black"></div>
      <!-- Test Cases Skeleton -->
      <div class="flex-[4] bg-[#1e1e1e] p-4 overflow-hidden">
        <!-- Test case tabs -->
        <div class="flex gap-3 mb-4 border-b border-gray-700 pb-3">
          <div class="h-4 w-20 rounded bg-gray-700 animate-pulse"></div>
          <div class="h-4 w-24 rounded bg-gray-800 animate-pulse"></div>
        </div>
        <!-- Test case tab buttons -->
        <div class="flex gap-2 mb-3">
          <div class="h-7 w-20 rounded-md bg-gray-700 animate-pulse"></div>
          <div class="h-7 w-20 rounded-md bg-gray-800 animate-pulse"></div>
          <div class="h-7 w-20 rounded-md bg-gray-800 animate-pulse"></div>
        </div>
        <!-- Input/Output blocks -->
        <div class="space-y-3">
          <div>
            <div class="h-3 w-12 rounded bg-gray-700 animate-pulse mb-2"></div>
            <div class="h-8 w-full rounded bg-[#2d2d2d] animate-pulse"></div>
          </div>
          <div>
            <div class="h-3 w-24 rounded bg-gray-700 animate-pulse mb-2"></div>
            <div class="h-8 w-full rounded bg-[#2d2d2d] animate-pulse"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #errorState>
  <div class="h-full w-full flex items-center justify-center">
    <div class="text-center">
      <div class="text-6xl mb-4">404</div>
      <p class="text-gray-400 text-lg mb-4">{{ error() }}</p>
      <a routerLink="/" class="text-green-60 hover:underline">Go back home</a>
    </div>
  </div>
</ng-template>
