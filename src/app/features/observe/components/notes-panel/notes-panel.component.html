<div class="h-full flex flex-col bg-gray-900/30">
  <!-- Header -->
  <div class="px-4 py-3 border-b border-gray-800/50">
    <h3 class="text-sm font-semibold text-white flex items-center gap-2">
      <svg
        class="w-4 h-4 text-gray-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
        />
      </svg>
      Private Notes
    </h3>
    <p class="text-xs text-gray-500 mt-0.5">Only visible to you</p>
  </div>

  <!-- Notes List -->
  <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2">
    <div *ngIf="notes().length === 0" class="text-center py-8">
      <p class="text-xs text-gray-500">No notes yet. Add observations below.</p>
    </div>

    <div
      *ngFor="let note of notes(); let i = index"
      class="group p-2.5 bg-gray-800/40 rounded-lg border border-gray-800/50"
    >
      <p class="text-sm text-gray-300 whitespace-pre-wrap">{{ note.text }}</p>
      <div class="flex items-center justify-between mt-1.5">
        <span class="text-[10px] text-gray-600">
          {{ note.timestamp | date: "HH:mm:ss" }}
        </span>
        <button
          (click)="removeNote(i)"
          class="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-red-400 transition-all"
        >
          <svg
            class="w-3.5 h-3.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="px-4 py-3 border-t border-gray-800/50">
    <div class="flex gap-2">
      <textarea
        [(ngModel)]="newNote"
        (keydown)="onKeyDown($event)"
        placeholder="Add a note..."
        rows="2"
        class="flex-1 px-3 py-2 bg-gray-800/50 border border-gray-700 rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-500/50 focus:border-blue-500 resize-none transition-colors"
      ></textarea>
      <button
        (click)="addNote()"
        class="self-end p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors"
      >
        <svg
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4v16m8-8H4"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
